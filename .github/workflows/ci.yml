name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.8'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --no-sync pytest -q
          uv run --no-sync mypy
          uv run --no-sync ruff check app tests

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh deploy/*.sh; do
            bash -n "$script"
          done

      - name: Test update script with local Git repositories
        run: python3 scripts/test-update.py

      - name: Test desktop autostart repair
        run: python3 scripts/test-autostart.py

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm check
          pnpm test
          pnpm build

      - name: Install browser and Korean fonts
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Test browser flows with mock data
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SMOKE_PUBLISH_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('longcat1132/tiktok-live-monitor:sha-{0}-{1}', github.sha, matrix.arch) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and test production container
        run: ./scripts/test-container.sh

      - name: Push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SMOKE_PUBLISH_TAG")" == 'linux/${{ matrix.arch }}' ]]
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'DOCKERHUB_TOKEN is not configured' >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username longcat1132 --password-stdin
          docker push "$SMOKE_PUBLISH_TAG"

  publish:
    name: Publish
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOSITORY: longcat1132/tiktok-live-monitor
      IMAGE_SHA: sha-${{ github.sha }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Publish multi-platform image
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'DOCKERHUB_TOKEN is not configured' >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username longcat1132 --password-stdin
          docker buildx imagetools create \
            -t "$REPOSITORY:latest" \
            -t "$REPOSITORY:$IMAGE_SHA" \
            "$REPOSITORY:$IMAGE_SHA-amd64" \
            "$REPOSITORY:$IMAGE_SHA-arm64"
          docker buildx imagetools inspect "$REPOSITORY:$IMAGE_SHA" --raw |
            python3 -c 'import json, sys; actual = sorted((item["platform"]["os"], item["platform"]["architecture"]) for item in json.load(sys.stdin)["manifests"] if item["platform"]["os"] == "linux"); expected = [("linux", "amd64"), ("linux", "arm64")]; sys.exit(0 if actual == expected else f"Unexpected image platforms: {actual}")'
