[project]
name = "tiktok-live-monitor"
version = "0.1.0"
description = "Portrait TikTok LIVE comment monitor"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "TikTokLive", "httpx"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["TikTokLive.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
