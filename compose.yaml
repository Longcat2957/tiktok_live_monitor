services:
  app:
    build: .
    image: tiktok-live-monitor:local
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4); assert json.load(r)['status']=='ok'"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
